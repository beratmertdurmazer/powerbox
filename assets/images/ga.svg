  <circle cx="250" cy="165" r="46" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="250" cy="165" r="32" fill="#fee2e2"/>
  <circle cx="250" cy="165" r="16" fill="#dc2626"/>
