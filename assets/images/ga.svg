      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="shadowGa" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#dc2626" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="500" height="400" fill="url(#gaLightBg)" rx="16"/>
  <rect x="150" y="80" width="200" height="225" rx="28" fill="#ffffff" stroke="#fca5a5" stroke-width="2.5" filter="url(#shadowGa)"/>
