  <text x="212" y="114" text-anchor="middle" fill="#fff" font-size="9" font-family="sans-serif" font-weight="bold">12V AKÜ</text>
  <rect x="255" y="100" width="65" height="20" rx="6" fill="#16a34a"/>
  <text x="287" y="114" text-anchor="middle" fill="#fff" font-size="9" font-family="sans-serif" font-weight="bold">3x PİLLİ</text>
  <text x="250" y="345" text-anchor="middle" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">POWERBOX GA ARAÇ İÇİ LPG ALARMI</text>
</svg>